# Default handler
handlers=java.util.logging.ConsoleHandler

# Default level
.level=INFO

# Console handler level - allow verbose GRPC/Spanner logs through when enabled.
java.util.logging.ConsoleHandler.level=FINEST
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tF %1$tT.%1$tL [%4$s] %3$s - %5$s%6$s%n

# Enable verbose Spanner and GRPC logging for probe debugging.
com.google.cloud.spanner.level=FINEST
com.google.cloud.spanner.spi.v1.KeyAwareChannel.level=FINEST
com.google.cloud.spanner.spi.v1.ChannelFinder.level=FINEST
com.google.cloud.spanner.spi.v1.KeyRangeCache.level=FINEST
com.google.cloud.spanner.spi.v1.KeyRecipeCache.level=FINEST
com.google.cloud.spanner.spi.v1.GrpcChannelEndpointCache.level=FINEST
com.google.cloud.spanner.spi.v1.EndpointLifecycleManager.level=FINEST
com.google.cloud.spanner.spi.v1.GapicSpannerRpc.level=FINER

com.google.api.gax.grpc.level=FINER
io.grpc.level=FINEST
io.grpc.ChannelLogger.level=FINEST
com.google.cloud.grpc.GcpManagedChannel.level=FINEST
com.google.cloud.grpc.GcpManagedChannelBuilder.level=FINEST

# Exclude extremely verbose per-RPC netty frame logs.
io.grpc.netty.NettyClientHandler.level=INFO
