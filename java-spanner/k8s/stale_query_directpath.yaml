apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: spanner-ns
  name: irahul-stale-query-directpath
spec:
  replicas: 1
  selector:
    matchLabels:
      app: irahul-stale-query-directpath
  template:
    metadata:
      labels:
        app: irahul-stale-query-directpath
    spec:
      containers:
        - name: stale-query-directpath
          image: us-central1-docker.pkg.dev/span-cloud-testing/irahul-images/irahul-client:6.117.0
          imagePullPolicy: Always
          ports:
            - name: jmx
              containerPort: 5000
              protocol: TCP
            - name: jdwp
              containerPort: 5005
              protocol: TCP
          command: ["java"]
          args:
            - -XX:-TieredCompilation
            - -XX:CompileThreshold=1000
            - -jar
            - /app/main.jar
          resources:
            requests:
              memory: "400Mi"
              cpu: "0.4"
            limits:
              memory: "400Mi"
              cpu: "0.4"
          env:
            - name: PROBE_TYPE
              value: "stale_query"
            - name: QPS
              value: "10"
            - name: OTEL_SERVICE_NAME
              value: "irahul-stale-query-directpath"
            - name: GOOGLE_SPANNER_ENABLE_DIRECT_ACCESS
              value: "true"
#            - name: JAVA_TOOL_OPTIONS
#              value: "-XX:+AlwaysPreTouch -XX:+UseG1GC -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=5000 -Dcom.sun.management.jmxremote.rmi.port=5000 -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1"
