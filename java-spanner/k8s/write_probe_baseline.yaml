apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: spanner-ns
  name: irahul-write-baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: irahul-write-baseline
  template:
    metadata:
      labels:
        app: irahul-write-baseline
    spec:
      containers:
        - name: write-baseline
          image: us-central1-docker.pkg.dev/span-cloud-testing/irahul-images/irahul-client:main-baseline
          command: ["java"]
          args:
            - -XX:-TieredCompilation
            - -XX:CompileThreshold=1000
            - -jar
            - /app/main.jar
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "1Gi"
              cpu: "1"
          env:
            - name: PROBE_TYPE
              value: "write"
            - name: QPS
              value: "1000"
            - name: NUM_ROWS
              value: "10000000"
            - name: PAYLOAD_SIZE
              value: "1000"
            - name: OTEL_SERVICE_NAME
              value: "irahul-write-baseline"
