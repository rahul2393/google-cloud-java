apiVersion: batch/v1
kind: Job
metadata:
  namespace: spanner-ns
  name: ycsb-otel-outbound-flight
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: ycsb-otel-outbound-flight
    spec:
      restartPolicy: Never
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      containers:
        - name: ycsb-client
          image: us-west1-docker.pkg.dev/outbound-flight/spanner-box/ycsb-client:latest
          imagePullPolicy: Always
          args:
            - run
            - cloudspanner
            - -P
            - workloads/workloadb
            - -P
            - cloudspanner/conf/cloudspanner.properties
            - -p
            - recordcount=1000000000000
            - -p
            - operationcount=1000000000
            - -p
            - maxexecutiontime=18000
            - -threads
            - "50"
            - -s
          resources:
            requests:
              cpu: "7"
              memory: "25Gi"
            limits:
              cpu: "7"
              memory: "25Gi"
          env:
            - name: GOOGLE_SPANNER_EXPERIMENTAL_LOCATION_API
              value: "true"
            - name: OTEL_PROJECT_ID
              value: "outbound-flight"
            - name: OTEL_SERVICE_NAME
              value: "ycsb-cloudspanner"
            - name: OTEL_METRIC_PREFIX
              value: "custom.googleapis.com/ycsb/grpc_gcp"
            - name: OTEL_METRIC_EXPORT_INTERVAL_SECONDS
              value: "10"
            - name: YCSB_ENABLE_OTEL_TRACING
              value: "true"
            - name: SPANNER_USE_OPENTELEMETRY_TRACING
              value: "true"
            - name: SPANNER_ENABLE_API_TRACING
              value: "true"
            - name: SPANNER_ENABLE_EXTENDED_TRACING
              value: "false"
            - name: SPANNER_ENABLE_END_TO_END_TRACING
              value: "false"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms16g -Xmx16g -XX:+AlwaysPreTouch -XX:+UseG1GC -Droot.level=ERROR -Djava.util.logging.config.file=/ycsb/cloudspanner/conf/logging-debug.properties"
